<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    line-height: 1.6;
    background-color: #f4f4f4;
}

header {
    background: #333;
    color: white;
    padding: 20px;
    margin-bottom: 20px;
    width: 100%;
}

.header-content {
    max-width: 800px;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

header h1 a {
    color: white;
    text-decoration: none;
}

nav a {
    color: white;
    text-decoration: none;
    margin-left: 15px;
}

nav a:hover {
    text-decoration: underline;
}

main {
    max-width: 800px;
    margin: 0 auto;
    padding: 0 20px;
}

.form-container {
    background: white;
    padding: 30px;
    border-radius: 5px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    max-width: 400px;
    margin: 0 auto;
}

.form-container h2 {
    margin-bottom: 20px;
    color: #333;
    text-align: center;
}

.error {
    background: #f8d7da;
    color: #721c24;
    padding: 10px;
    border-radius: 3px;
    margin-bottom: 15px;
}

.form-group {
    margin-bottom: 15px;
}

.form-group label {
    display: block;
    margin-bottom: 5px;
    color: #333;
    font-weight: bold;
}

.form-group input {
    width: 100%;
    padding: 10px;
    border: 1px solid #ddd;
    border-radius: 3px;
    font-size: 14px;
}

.form-group input:focus {
    outline: none;
    border-color: #007bff;
}

button {
    width: 100%;
    padding: 12px;
    background: #007bff;
    color: white;
    border: none;
    border-radius: 3px;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #0056b3;
}

.link-text {
    text-align: center;
    margin-top: 15px;
    color: #666;
}

.link-text a {
    color: #007bff;
    text-decoration: none;
}

.link-text a:hover {
    text-decoration: underline;
}
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <h1>My Blog</h1>

            <nav>
                <a href="{% url 'Accounts:login' %}">Login</a>
                <a href="">Register</a>
            </nav>
        </div>
    </header>

    <main>
        <div class="form-container">
                {% if next %}
                    <p style="color: red; position: absolute; top: 50px; left: 50%; transform: translateX(-50%);">
                        You must login to view post page
                    </p>
                {% endif %}
            <h2>Login</h2>

            {% if form.errors %}
                <div class="error">
                    <p>Invalid username or password.</p>
                </div>
            {% endif %}

            <form method="post">
                {% csrf_token %}
                <div class="form-group">
                    <label for="id_username">Username</label>
                    <input type="text" name="username" id="id_username" required>
                </div>

                <div class="form-group">
                    <label for="id_password">Password</label>
                    <input type="password" name="password" id="id_password" required>
                </div>

                <button type="submit">Login</button>
            </form>

{#            <p class="link-text">Don't have an account? <a href="{% url 'register' %}">Register here</a></p>#}
        </div>
    </main>
</body>
</html>
