{% extends 'base.html' %}
{% load static %}

{% block content %}
    <h2>{% if request.resolver_match.url_name == 'post-create' %}New Post{% else %}Edit Post{% endif %}</h2>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.media }}
        {{ form.as_p }}
        <button type="submit" class="btn btn-success">Save</button>
    </form>
{% endblock %}
