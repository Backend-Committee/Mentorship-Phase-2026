{% block content %}
{% endblock %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adhkar App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<script>
    const reminderTime = "{{ user_reminder.reminder_time|time:'H:i' }}";
    
    if (reminderTime) {
        setInterval(() => {
            const now = new Date();
            const currentTime = now.getHours().toString().padStart(2, '0') + ":" + 
                                now.getMinutes().toString().padStart(2, '0');

            if (currentTime === reminderTime) {
                if (!window.notifiedToday) { 
                    showNotification();
                    window.notifiedToday = true; 
                }
            } else {
                window.notifiedToday = false;
            }
        }, 10000); 
    }

    function showNotification() {
        alert("🔔 It's time for your Adhkar! (" + "{{ user_reminder.category.name }}" + ")");
    }
</script>
</body>
