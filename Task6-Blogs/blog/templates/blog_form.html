{% extends 'base.html' %}
{% block title %}{% if object %}Edit Post{% else %}New Post{% endif %}{% endblock %}
{% block content %}
<div class="form-container">
    <h1>{% if object %}Edit Post{% else %}New Post{% endif %}</h1>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn">Save</button>
        <a href="{% url 'blog:blog_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
