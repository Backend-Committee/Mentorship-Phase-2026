
<style>
#erd { width: 100%; overflow-x: auto; }
#erd svg { max-width: 100%; height: auto; }
#erd svg.erDiagram .divider path { stroke-opacity: 0.4; }
#erd svg.erDiagram .row-rect-odd path,
#erd svg.erDiagram .row-rect-odd rect,
#erd svg.erDiagram .row-rect-even path,
#erd svg.erDiagram .row-rect-even rect { stroke: none !important; }
</style>
<div id="erd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    primaryColor: dark ? '#1e3a5f' : '#dbeafe',
    primaryTextColor: dark ? '#bfdbfe' : '#1e3a5f',
    primaryBorderColor: dark ? '#3b82f6' : '#3b82f6',
    lineColor: dark ? '#64748b' : '#64748b',
    textColor: dark ? '#cbd5e1' : '#1e293b',
    edgeLabelBackground: dark ? '#1e293b' : '#f8fafc',
    attributeBackgroundColorEven: dark ? '#0f2a4a' : '#eff6ff',
    attributeBackgroundColorOdd: dark ? '#0a1f38' : '#f8fafc',
  },
  er: { diagramPadding: 30, layoutDirection: 'TB', minEntityWidth: 100, minEntityHeight: 75, entityPadding: 15, useMaxWidth: true }
});

const diagram = `erDiagram
  USER {
    uuid id PK
    string username
    string email
    string password_hash
    timestamp created_at
    timestamp updated_at
  }

  PANEL {
    uuid id PK
    string name
    uuid owner_id FK
    timestamp created_at
    timestamp updated_at
  }

  PANEL_USER {
    uuid user_id FK
    uuid panel_id FK
    enum role
    uuid invited_by FK
    timestamp joined_at
  }

  CATEGORY {
    uuid id PK
    uuid panel_id FK
    string name
    string color_hex
    boolean is_default
    timestamp created_at
  }

  EXPENSE {
    uuid id PK
    uuid panel_id FK
    uuid category_id FK
    uuid created_by FK
    decimal amount
    date date
    string description
    timestamp deleted_at
    timestamp created_at
    timestamp updated_at
  }

  BUDGET {
    uuid id PK
    uuid panel_id FK
    uuid category_id FK
    decimal limit_amount
    enum period
    date start_date
    date end_date
    int alert_threshold
    timestamp created_at
  }

  NOTIFICATION {
    uuid id PK
    uuid user_id FK
    uuid panel_id FK
    enum type
    string message
    boolean is_read
    timestamp created_at
  }

  USER ||--o{ PANEL : "owns"
  USER ||--o{ PANEL_USER : "belongs to"
  PANEL ||--o{ PANEL_USER : "has members"
  PANEL ||--o{ CATEGORY : "defines"
  PANEL ||--o{ EXPENSE : "contains"
  PANEL ||--o{ BUDGET : "sets"
  PANEL ||--o{ NOTIFICATION : "generates"
  CATEGORY ||--o{ EXPENSE : "classifies"
  CATEGORY ||--o{ BUDGET : "targets"
  USER ||--o{ EXPENSE : "records"
  USER ||--o{ NOTIFICATION : "receives"
`;

const { svg } = await mermaid.render('erd-svg', diagram);
document.getElementById('erd').innerHTML = svg;

document.querySelectorAll('#erd svg.erDiagram .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});

document.querySelectorAll('#erd svg.erDiagram .row-rect-odd path, #erd svg.erDiagram .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
