{% extends 'index.html' %}

{% block content %}
    <h2 style="text-align: center-top;">All Blog Posts </h2>

    <ul class="blog-list">
        {% for blog in blogs %}
            <li>
                <a href="{% url 'blog_detail' blog.id %}">
                    {{ blog.title }}
                </a>
                <p>{{ blog.content|truncatewords:10 }}</p>
            </li>
        {% endfor %}
    </ul>

{% endblock %}
