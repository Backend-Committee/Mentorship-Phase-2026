{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">Log Food</div>
            <div class="card-body">
                <form method="POST">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary w-100 mt-2">Save</button>
                </form>
                <a href="{% url 'nutrition_list' %}" class="btn btn-outline-light w-100 mt-2">Cancel</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
