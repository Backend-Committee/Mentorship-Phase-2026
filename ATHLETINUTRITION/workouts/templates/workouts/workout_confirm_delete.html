{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card">
            <div class="card-header">Delete Workout</div>
            <div class="card-body text-center">
                <p>Are you sure you want to delete this workout?</p>
                <form method="POST">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger me-2">Yes, delete</button>
                </form>
                <a href="{% url 'workout_list' %}" class="btn btn-outline-light mt-2">Cancel</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
