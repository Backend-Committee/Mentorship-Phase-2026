<!DOCTYPE html>
<html>
<body>
    <h1>My Workouts</h1>
    <a href="{% url 'workout_add' %}">Add Workout</a>
    <table>
        <tr><th>Date</th><th>Type</th><th>Duration</th><th>Notes</th><th>Actions</th></tr>
        {% for workout in workouts %}
        <tr>
            <td>{{ workout.date }}</td>
            <td>{{ workout.workout_type }}</td>
            <td>{{ workout.duration_minutes }} mins</td>
            <td>{{ workout.notes }}</td>
            <td>
                <a href="{% url 'workout_edit' workout.pk %}">Edit</a>
                <a href="{% url 'workout_delete' workout.pk %}">Delete</a>
            </td>
        </tr>
        {% empty %}
        <tr><td colspan="5">No workouts yet.</td></tr>
        {% endfor %}
    </table>
</body>
</html>
