{% extends 'base.html' %}
{% block content %}
<h1 class="mb-4">Incoming Requests</h1>
<div class="card">
    <div class="card-body p-0">
        <table class="table table-dark mb-0">
            <thead><tr><th>Athlete</th><th>Actions</th></tr></thead>
            <tbody>
                {% for req in requests %}
                <tr>
                    <td>{{ req.athlete.user.username }}</td>
                    <td>
                        <form method="POST" action="{% url 'accept_request' req.pk %}" class="d-inline">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-sm btn-success">Accept</button>
                        </form>
                        <form method="POST" action="{% url 'decline_request' req.pk %}" class="d-inline">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-sm btn-danger">Decline</button>
                        </form>
                    </td>
                </tr>
                {% empty %}
                <tr><td colspan="2" class="text-center">No pending requests.</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
